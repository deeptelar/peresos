# Builds the packages of Peresós, with its own Java, on Linux, macOS and Windows, and installs each
# with its installer to see that it starts. On a tag v1.2.3 it publishes them as a GitHub release,
# where install.sh and install.ps1 download them. On a pull request, or by hand (Actions > Package >
# Run workflow), it keeps them as artifacts of the run only.
name: Package

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for an older glibc: the launcher then runs on more Linuxes.
          - os: ubuntu-22.04
          - os: macos-14
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "The tag $GITHUB_REF_NAME is not v$version of build.gradle.kts"; exit 1; }

      - run: ./gradlew appImage

      - name: Pack for Linux
        if: runner.os == 'Linux'
        run: packaging/linux.sh
      - name: Pack for macOS
        if: runner.os == 'macOS'
        run: packaging/macos.sh
      - name: Pack for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory build/dist -Force | Out-Null
          Compress-Archive build/jpackage/peresos build/dist/peresos-windows-x64.zip

      # Each installer, from the files just built: the command must run from the PATH, and the doctor
      # must get to its report. Ollama is not there, so the doctor says so and exits with 1. Feed to
      # Peresós in the menu of files must feed a file, and peresos update must install the build
      # again. Then peresos uninstall must remove all of it, and the pile only when told.
      - name: Install with apt
        if: runner.os == 'Linux'
        run: |
          # A runner has no file manager: a pretend Nautilus gets the menu of files.
          mkdir -p /tmp/pretend && printf '#!/bin/sh\n' > /tmp/pretend/nautilus && chmod 755 /tmp/pretend/nautilus
          PATH=/tmp/pretend:$PATH PERESOS_FROM=$PWD/build/dist sh install.sh
          peresos --version
          peresos doctor --report </dev/null || true
          ls ~/.peresos/logs/doctor-*.md
          printf 'Reply to the landlord\n' > note.txt
          ~/.local/share/nautilus/scripts/"Feed to Peresós" "$PWD/note.txt"
          peresos pile | grep "Text: note.txt"
          printf 'y\nn\n' | peresos uninstall
          if dpkg -s peresos >/dev/null 2>&1 || [ -e /usr/bin/peresos ] || [ -e /opt/peresos ]; then echo "apt did not remove it"; exit 1; fi
          [ ! -e ~/.local/share/nautilus/scripts/"Feed to Peresós" ] || { echo "The menu of Nautilus is still there"; exit 1; }
          ls ~/.peresos/logs/doctor-*.md
      - name: Install in the home
        if: runner.os != 'Windows'
        run: |
          mkdir -p /tmp/pretend && printf '#!/bin/sh\n' > /tmp/pretend/nautilus && chmod 755 /tmp/pretend/nautilus
          PATH=/tmp/pretend:$PATH PERESOS_LOCAL=1 PERESOS_FROM=$PWD/build/dist sh install.sh
          ~/.local/bin/peresos --version
          ~/.local/bin/peresos feed "Try the installer"
          printf 'Reply to the landlord\n' > note.txt
          ~/.local/bin/peresos feed --notify note.txt
          ~/.local/bin/peresos pile | grep "Text: note.txt"
          # An item edited and removed in place: the pile file is replaced whole each time.
          n=$(~/.local/bin/peresos pile | grep "Try the installer" | sed 's/^ *\([0-9]*\)\..*/\1/')
          ~/.local/bin/peresos pile edit "$n" "Try the installer, edited"
          ~/.local/bin/peresos pile | grep "$n.  Try the installer, edited"
          ~/.local/bin/peresos pile remove "$n"
          if ~/.local/bin/peresos pile | grep "Try the installer"; then echo "peresos pile remove left it"; exit 1; fi
          ~/.local/bin/peresos pile | grep "Text: note.txt"
          cat ~/.peresos/logs/doctor-*.md 2>/dev/null | tail -20 || true
          # peresos update, with the build: the installer next to its packages, outside build/dist.
          mkdir -p /tmp/from && cp build/dist/* install.sh /tmp/from/
          printf 'y\n' | PERESOS_FROM=/tmp/from ~/.local/bin/peresos update
          ~/.local/bin/peresos --version
          # An icon on the desktop, and the start at login.
          ~/.local/bin/peresos desktop on | grep "Peresós has an icon"
          ~/.local/bin/peresos autostart on | grep "Peresós has the start at login"
          ~/.local/bin/peresos gemma off
          ~/.local/bin/peresos doctor </dev/null | grep "Gemma.*off"
          printf 'y\ny\n' | ~/.local/bin/peresos uninstall
          for gone in ~/.local/bin/peresos ~/.local/share/peresos ~/.local/share/applications/peresos.desktop ~/Applications/Peresos.app ~/.peresos ~/.local/share/nautilus/scripts/"Feed to Peresós" \
            ~/Desktop/peresos.desktop ~/.config/autostart/peresos.desktop ~/Desktop/Peresós ~/Library/LaunchAgents/dev.deeptelar.peresos.plist; do
            [ ! -e "$gone" ] && [ ! -L "$gone" ] || { echo "$gone is still there"; exit 1; }
          done
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PERESOS_FROM = "$pwd\build\dist"
          ./install.ps1
          peresos --version
          peresos feed "Try the installer"
          peresos pile
          peresos doctor --report
          Get-ChildItem "$env:USERPROFILE\.peresos\logs\doctor-*.md" | Get-Content
          $shortcut = "$([Environment]::GetFolderPath('Programs'))\Peres$([char]0xF3)s.lnk"
          if (-not (Test-Path $shortcut)) { throw "No shortcut in the Start menu" }
          # Feed to Peresós in the menu of files: its keys, and the window's launcher that they run.
          $menus = 'image', '.pdf' | ForEach-Object { "HKCU:\Software\Classes\SystemFileAssociations\$_\shell\Peresos" }
          $menus | ForEach-Object { if (-not (Test-Path "$_\command")) { throw "No Feed to Peresós in $_" } }
          "Reply to the landlord" | Set-Content note.txt
          Start-Process -Wait -FilePath "$env:LOCALAPPDATA\Programs\Peresos\peresos-window.exe" -ArgumentList 'feed', '--notify', "`"$pwd\note.txt`""
          if (-not ((peresos pile) -match 'Text: note.txt')) { throw "Feed to Peresós did not feed it" }
          # An item edited and removed in place: Windows replaces a file differently.
          peresos feed "Reply to Jordi"
          $n = ((peresos pile) | Select-String 'Reply to Jordi' | Select-Object -First 1).Line.Trim().Split('.')[0]
          peresos pile edit $n "Reply to Jordi: yes"
          if (-not ((peresos pile) -match 'Reply to Jordi: yes')) { throw "peresos pile edit did not edit it" }
          peresos pile remove $n
          if ((peresos pile) -match 'Reply to Jordi') { throw "peresos pile remove left it" }
          if (-not ((peresos pile) -match 'Text: note.txt')) { throw "peresos pile remove took the wrong one" }
          # The shortcut of the Start menu, which Peresós wrote itself, opens the window.
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Peres$([char]0xF3)s.lnk"
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($menu).TargetPath
          if ($target -ne "$env:LOCALAPPDATA\Programs\Peresos\peresos-window.exe") { throw "The shortcut opens $target" }
          function Opened($how) {
              for ($i = 0; $i -lt 30 -and -not (Get-Process peresos-window -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
              if (-not (Get-Process peresos-window -ErrorAction SilentlyContinue)) { throw "$how opened no window" }
              Stop-Process -Name peresos-window
              Start-Sleep 2
          }
          Start-Process $menu
          Opened "The shortcut of the Start menu"
          # peresos window returns at once, and the window goes on without the terminal.
          peresos window
          Opened "peresos window"
          peresos desktop on
          peresos autostart on
          $desktop = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders').Desktop
          $openers = "$desktop\Peres$([char]0xF3)s.lnk", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\Peres$([char]0xF3)s.lnk"
          $openers | ForEach-Object { if (-not (Test-Path $_)) { throw "No $_" } }
          # A running peresos.exe cannot replace itself: the terminal is told to run the installer.
          $said = "y" | peresos update | Out-String
          if (-not ($said -match 'install.ps1')) { throw "peresos update did not say how: $said" }
          "y", "n" | peresos uninstall
          # PowerShell removes it once peresos has quit.
          $dir = "$env:LOCALAPPDATA\Programs\Peresos"
          for ($i = 0; $i -lt 30 -and (Test-Path $dir); $i++) { Start-Sleep 1 }
          if (Test-Path $dir) { throw "$dir is still there" }
          if (Test-Path $shortcut) { throw "The shortcut is still there" }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir) { throw "$dir is still in the PATH" }
          if (-not (Test-Path "$env:USERPROFILE\.peresos\pile.md")) { throw "The pile went, though it was kept" }
          $menus + $openers | ForEach-Object { if (Test-Path $_) { throw "$_ is still there" } }
          exit 0
      # The same, in the Windows PowerShell of a PC whose policy controls apps (a PC of work, Smart App
      # Control): Constrained Language Mode, which allows cmdlets but not .NET or COM. __PSLockdownPolicy
      # puts every new Windows PowerShell in it.
      - name: Install on Windows in Constrained Language Mode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [Environment]::SetEnvironmentVariable('__PSLockdownPolicy', '4', 'Machine')
          $mode = powershell -NoProfile -Command '$ExecutionContext.SessionState.LanguageMode'
          if ($mode -ne 'ConstrainedLanguage') { throw "Windows PowerShell runs in $mode" }
          $env:PERESOS_FROM = "$pwd\build\dist"
          $said = powershell -NoProfile -Command 'Get-Content -Raw install.ps1 | Invoke-Expression' | Out-String
          $said
          if (-not ($said -match 'in the Start menu')) { throw "The installer did not put it in the Start menu" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Peres$([char]0xF3)s.lnk")) { throw "No shortcut in the Start menu" }
          $dir = "$env:LOCALAPPDATA\Programs\Peresos"
          if (-not (Test-Path "$dir\peresos.exe")) { throw "Not installed" }
          if (-not (((Get-ItemProperty HKCU:\Environment).Path -split ';') -contains $dir)) { throw "$dir is not in the PATH" }
          & "$dir\peresos.exe" --version
          "y", "y" | & "$dir\peresos.exe" uninstall
          for ($i = 0; $i -lt 30 -and (Test-Path $dir); $i++) { Start-Sleep 1 }
          if (Test-Path $dir) { throw "$dir is still there" }
          if (((Get-ItemProperty HKCU:\Environment).Path -split ';') -contains $dir) { throw "$dir is still in the PATH" }
          if (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\image\shell\Peresos") { throw "Feed to Peresós is still there" }
          [Environment]::SetEnvironmentVariable('__PSLockdownPolicy', $null, 'Machine')

      - uses: actions/upload-artifact@v7
        with:
          name: peresos-${{ runner.os }}
          path: build/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Install it with its own Java, and the `peresos` command on your PATH:

          - **Linux and macOS:** `curl -fsSL https://raw.githubusercontent.com/deeptelar/peresos/main/install.sh | sh`
          - **Windows (PowerShell):** `irm https://raw.githubusercontent.com/deeptelar/peresos/main/install.ps1 | iex`
          - **Debian and Ubuntu by hand:** download `peresos-linux-amd64.deb`, then `sudo apt install ./peresos-linux-amd64.deb`

          Then `peresos doctor` checks Ollama and Gemma, and `peresos doctor --fix` pulls Gemma.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Peresós ${GITHUB_REF_NAME#v}" --notes-file notes.md
